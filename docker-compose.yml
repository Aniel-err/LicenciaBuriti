services:
  postgres:
    image: postgres:16-alpine
    container_name: licencia-buriti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: licencia
      POSTGRES_PASSWORD: licencia
      POSTGRES_DB: licencia_buriti
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U licencia -d licencia_buriti"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
